line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "T20"]
ignore = [
    "E501",   # Allow long lines
    "S101",   # Allow assert
    "T201",   # Allow print statements
    "S110",   # try-except-pass (intentional fire-and-forget)
    "S112",   # try-except-continue (intentional fire-and-forget)
    "S311",   # suspicious-non-cryptographic-random-usage (used for non-security purposes)
    "S108",   # hardcoded-temp-file (intentional debug output paths)
    "S104",   # hardcoded-bind-all-interfaces (intentional for dev/docker)
    "S105",   # hardcoded-password-string (default config values)
    "S324",   # hashlib-insecure-hash-function (not used for security)
    "S608",   # hardcoded-sql-expression (intentional schema operations)
    "N815",   # mixed-case-variable-in-class-scope (Pydantic model fields use camelCase)
    "N806",   # non-lowercase-variable-in-function (intentional naming)
    "B008",   # function-call-in-default-argument (FastAPI Depends() pattern)
    "E402",   # module-import-not-at-top (needed for alembic/conditional imports)
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # Allow assert and hardcoded passwords in tests

[format]
quote-style = "double"
