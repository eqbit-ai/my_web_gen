line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "T20"]
ignore = ["E501", "S101", "T201"]  # Allow long lines in some cases, assert in tests, print statements (being replaced)

[lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # Allow assert and hardcoded passwords in tests

[format]
quote-style = "double"
