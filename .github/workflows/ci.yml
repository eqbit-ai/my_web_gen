name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 371170753756.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: meydan-dev-cluster

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/ --statistics
        continue-on-error: true

      - name: Run tests
        run: pytest backend/tests/ --tb=short -q
        continue-on-error: true
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
          ANTHROPIC_API_KEY: test-key
          OPENAI_API_KEY: test-key

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: cd frontend && npm ci --legacy-peer-deps && npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint-and-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/meydan-api:latest -f backend/Dockerfile backend/
          docker push $ECR_REGISTRY/meydan-api:latest

      - name: Build and push frontend image
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/meydan-frontend:latest -f frontend/Dockerfile frontend/
          docker push $ECR_REGISTRY/meydan-frontend:latest

      - name: Deploy API service
        run: aws ecs update-service --cluster $ECS_CLUSTER --service meydan-dev-api --force-new-deployment

      - name: Deploy Worker service
        run: aws ecs update-service --cluster $ECS_CLUSTER --service meydan-dev-worker --force-new-deployment

      - name: Deploy Frontend service
        run: aws ecs update-service --cluster $ECS_CLUSTER --service meydan-dev-frontend --force-new-deployment

      - name: Wait for stable deployment
        run: |
          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services meydan-dev-api meydan-dev-frontend
          echo "All services stable!"
