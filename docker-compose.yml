services:
  # ── FastAPI Backend (API) ──────────────────────────────────────────
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis_2024}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://meydan:${POSTGRES_PASSWORD:-meydan123}@postgres:5432/meydan_db
      - WORKERS=8
      - TRUSTED_PROXY=true
      - DEV_MODE=false
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 5
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Background Worker ──────────────────────────────────────────────
  worker:
    build: ./backend
    command: python -m app.worker
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis_2024}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://meydan:${POSTGRES_PASSWORD:-meydan123}@postgres:5432/meydan_db
      - WORKER_CONCURRENCY=4
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 10
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped

  # ── React Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --hz 10
      --maxclients 10000
      --requirepass ${REDIS_PASSWORD:-changeme_redis_2024}
    # ports:
    #   - "6379:6379"  # Only expose for local dev — never in production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1200M
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: meydan_postgres
    environment:
      POSTGRES_USER: meydan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meydan123}
      POSTGRES_DB: meydan_db
    command: >
      postgres
      -c max_connections=1000
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=2
      -c max_worker_processes=8
    # ports:
    #   - "5432:5432"  # Only expose for local dev — never in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meydan -d meydan_db"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # ── Nginx Load Balancer ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
