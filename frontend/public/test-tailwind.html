<!DOCTYPE html>
<html>
<head><title>Tailwind Local Test</title></head>
<body>
<h2>Test: Local Tailwind JS in iframe via doc.write</h2>
<iframe id="f1" style="width:100%;height:300px;border:2px solid green"></iframe>
<p id="status">Loading...</p>

<script>
var testHTML = '<!DOCTYPE html><html><head>' +
  '<script src="/tailwind.js"><\/script>' +
  '</head><body>' +
  '<div class="bg-blue-500 text-white p-4 rounded-lg m-4 text-xl font-bold">Blue box = Tailwind works!</div>' +
  '<div class="flex gap-4 p-4">' +
  '<div class="bg-red-500 text-white p-4 rounded-lg flex-1 text-center">Red</div>' +
  '<div class="bg-green-500 text-white p-4 rounded-lg flex-1 text-center">Green</div>' +
  '<div class="bg-purple-500 text-white p-4 rounded-lg flex-1 text-center">Purple</div>' +
  '</div></body></html>';

var f1 = document.getElementById('f1');
f1.addEventListener('load', function() {
  var doc = f1.contentDocument;
  doc.open();
  doc.write(testHTML);
  doc.close();
  document.getElementById('status').textContent = 'Injected via doc.write with local /tailwind.js';
});
</script>
</body>
</html>
